<title>Table du castor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout : une table de bois vue de dessus ; barre d'outils en haut, la table défile et zoome, un panneau à droite détaille la pièce choisie. Un seul univers visuel, comme le prototype. */
:root{
  color-scheme:dark;
  --table:#2A211A; --table-2:#3A2E24; --t-ink:#EFE6D0; --t-muted:#BDB094;
  --parch:#EFE5CB; --parch-2:#F6EFDC; --edge:#BFAE7F; --ink:#2A2418; --muted:#6B5F45;
  --frame:#22332F; --brandy:#B86E12; --danger:#A3352A; --gold:#C9962E;
  --k-maison:#22332F; --k-perso:#8A5A14; --k-atout:#3E5A7A; --k-event:#3F6D78; --k-grand:#8E2F25; --k-dem:#5A4A7A;
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --serif:"IM Fell English", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--table);color:var(--t-ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.bar h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1;margin-right:auto}
.bar label{font-size:.88rem;color:var(--t-muted)}
select,.tb{font:inherit;font-size:.9rem;padding:5px 10px;border-radius:6px;border:1px solid #5A4A3B;background:var(--table-2);color:var(--t-ink);cursor:pointer}
.tb:disabled{opacity:.4;cursor:not-allowed}
.tb.warn{border-color:#C26A5C;color:#F6D9D2}
.zoom{display:flex;gap:4px;align-items:center}
.zoom output{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--t-muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;min-height:0}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}}
.view{overflow:auto;border-radius:12px;background:#231B15 repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 13px);box-shadow:inset 0 0 0 1px #3F3227;min-height:300px}
.sizer{position:relative}
#table{position:absolute;left:0;top:0;transform-origin:0 0}
#printed{position:absolute;left:0;top:0;pointer-events:none}
#pieces{position:absolute;left:0;top:0}
.side{background:var(--table-2);border:1px solid #4E3F31;border-radius:12px;padding:14px;overflow:auto;display:grid;align-content:start;gap:12px;min-height:0}
.side h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.15}
.side p{margin:0}
.side .muted{color:var(--t-muted);font-size:.9rem}
.side .acts{display:flex;flex-wrap:wrap;gap:6px}
.side ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.9rem;color:var(--t-ink)}
.side kbd{font-family:var(--body);font-size:.8rem;padding:0 5px;border:1px solid #6B5A49;border-radius:4px;background:#2A211A}
.big{display:flex;justify-content:center}
.big .card{position:relative;width:220px;height:308px;font-size:200%}
.big .card .ct{font-size:1.6rem}
.big .card .cf{font-size:1rem}
.big .card .cn{font-size:.9rem}
.big .card .cb{font-size:12px;padding:6px 12px}
.big .card .ct{padding:10px 12px 4px}
.big .card .cf{padding:0 12px}
.big .card.back .bk{font-size:22px}
.big .card.back .bk small{font-size:12px}
.big .chit{position:relative;width:96px;height:96px;font-size:1.9rem}
.big .chit .cl{font-size:.85rem}
:focus-visible{outline:2px solid #E7C27A;outline-offset:2px}

/* Pièces */
.pc{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.pc.dragging{cursor:grabbing;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.pc.sel{outline:3px solid #E7C27A;outline-offset:2px}
.card{width:100px;height:140px;border-radius:8px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 8px rgba(0,0,0,.3);display:grid;grid-template-rows:auto auto 1fr;background:var(--parch);color:var(--ink);border:1px solid var(--edge)}
.card .cb{font-size:7px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#EFE6D0;background:var(--k);padding:3px 6px}
.card .ct{font-family:var(--display);font-size:11.5px;line-height:1.1;padding:5px 6px 2px}
.card .cf{font-size:8px;line-height:1.25;padding:0 6px}
.card .cn{display:none}
.card.back{display:grid;place-items:center;text-align:center;background:var(--kb,#3A2A1C) repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 3px,transparent 3px 9px);color:#EFE6D0;border-color:#1E1610}
.card.back .bk{font-family:var(--display);font-size:12px;line-height:1.15;padding:6px}
.card.back .bk small{display:block;font-family:var(--body);font-size:8px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:6px}
.chit{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink);border:2px solid #7A5232;background:#F6EFDC;box-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center;line-height:1}
.chit .cl{font-size:6.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.chit.prem{background:#F1D58C;border-color:#A07418}
.chit.hidf{background:#E9DCC0;border-color:#5A3B24}
.chit.evt{background:#F3DCD8;border-color:#A3352A;color:#7A241B}
.chit.down{color:#F6EFDC;border-color:#2B1D13}
.chit.down.classic{background:#8A6A45}
.chit.down.premium{background:#7A5A18;border-color:#4A360A}
.chit.down.hidden{background:#3A2618}
.chit.gras{box-shadow:0 0 0 3px #E9BE4A,0 2px 0 rgba(0,0,0,.35)}
.tok{display:grid;place-items:center}
.tok svg{display:block;width:100%;height:100%;overflow:visible}
.deck,.bag{display:grid;grid-template-rows:18px 1fr;border-radius:9px;overflow:visible}
.deck{width:104px;height:162px}
.deck .stack{position:relative;margin-top:2px}
.deck .stack .card{position:absolute;left:0;top:0}
.deck .stack .card.s2{left:3px;top:3px;opacity:.85}
.deck .stack .card.s1{left:1.5px;top:1.5px}
.handle{font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#EFE6D0;background:#4A3A2C;border-radius:6px 6px 0 0;padding:2px 6px;display:flex;justify-content:space-between;cursor:move}
.count{position:absolute;right:-8px;bottom:-8px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:#E7C27A;color:var(--ink);font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.4);z-index:2}
.deck .empty{width:100px;height:140px;border:2px dashed #8A7A5A;border-radius:8px;display:grid;place-items:center;font-size:10px;color:#BDB094;text-align:center;padding:6px}
.bag{width:110px;height:122px}
.bag .pouch{position:relative;margin-top:2px;border-radius:20px 20px 40px 40px;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:13px;line-height:1.1;padding:10px;color:#EFE6D0;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2),0 3px 6px rgba(0,0,0,.35)}
.bag .pouch small{display:block;font-family:var(--body);font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px;opacity:.85}
.die{width:38px;height:38px;border-radius:8px;background:#FBF7EC;border:2px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;gap:3px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.die span{display:block}
.die.cross{background:#DCE9EC;border-color:#1B3B5C}
.die .pip{background:var(--ink);border-radius:50%}
@media (prefers-reduced-motion:no-preference){.die.roll{animation:tumble .45s ease-out}}
@keyframes tumble{from{transform:rotate(-260deg) scale(.6)}to{transform:none}}
#printed .pl{font-family:var(--display);fill:#2A2418;font-size:15px}
#printed .ml{font-family:var(--serif);font-style:italic;fill:#6B5F45;font-size:13px}
#printed .ct{font-family:var(--body);font-weight:700;font-size:12px;fill:#2A2418}
#printed .cl{font-family:var(--body);font-size:11px;fill:#6B5F45}
#printed .cm{font-family:var(--display);font-size:16px;fill:#2A2418}
#printed .cq{font-family:var(--body);font-size:11px;fill:#6B5F45}
#printed .gold{fill:#8A5A14;font-weight:700}
#printed .ice{fill:#3F6D78;font-weight:700}
#printed .lab{font-family:var(--display);font-size:18px;fill:#EFE6D0}
#printed .labs{font-family:var(--body);font-size:12px;fill:#BDB094}
#printed .num{font-family:var(--body);font-size:11px;font-weight:700;fill:#fff}
</style>

<div class="app">
  <div class="bar">
    <h1>Table du castor</h1>
    <label for="nplayers">Marchands</label>
    <select id="nplayers"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select>
    <button class="tb warn" id="reset" data-cmd="reset">Nouvelle installation</button>
    <button class="tb" data-cmd="undo" id="undo">Annuler</button>
    <div class="zoom"><button class="tb" data-cmd="zout" aria-label="Dézoomer">−</button><output id="zv">50 %</output><button class="tb" data-cmd="zin" aria-label="Zoomer">+</button><button class="tb" data-cmd="fit">Ajuster</button></div>
  </div>
  <div class="main">
    <div class="view" id="view"><div class="sizer" id="sizer"><div id="table"><svg id="printed"></svg><div id="pieces"></div></div></div></div>

  </div>
</div>

<script>
/* ---------- Données du jeu ---------- */
const COL=["#A8322A","#2F5E8E","#4E7A2C","#D3A12A"],COL_DARK=["#6E1F19","#1B3B5C","#2F4D19","#8A6814"],COLNAME=["rouge","bleu","vert","jaune"];
const GREY="#8E8A80",GREY_DARK="#5F5B53";
const MCAP=["Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre"];
const KIND={maison:"Maison",personnage:"Personnage",atout:"Atout",recrue:"Recrue",contrat:"Contrat",nation:"Alliance",charge:"Charge"};
const RCARDS=[{"id":"r_garde","kind":"recrue","star":0,"title":"Garde-magasin","effect":"Quand vous jouez « Attendre », gagnez 1 livre.","note":"Il tient l’entrepôt de la basse-ville pendant que les canots sont au loin."},{"id":"r_teneur","kind":"recrue","star":0,"title":"Teneur de livres","effect":"Une fois par mois, « Changer les prix » ne vous coûte pas d’action.","note":"Ses registres suivent les cours mieux que personne."},{"id":"r_canotier","kind":"recrue","star":0,"title":"Canotier d’expérience","effect":"Une fois par an, un de vos canots qui arrive aux Grands Lacs ou au Supérieur est prêt tout de suite.","note":"Il connaît chaque portage de l’Outaouais."},{"id":"r_facteur","kind":"recrue","star":0,"title":"Facteur de La Rochelle","effect":"Les cales vides de vos commandes d’hiver ne coûtent rien.","note":"Votre homme sur les quais trouve toujours un complément de fret."},{"id":"r_calfat","kind":"recrue","star":0,"title":"Calfat","effect":"L’entretien d’hiver de vos navires est gratuit.","note":"Étoupe et brai : la coque passe l’hiver sans dommage."},{"id":"r_notaire","kind":"recrue","star":1,"title":"Notaire royal","effect":"Vos dettes non remboursées ne grossissent pas en hiver.","note":"Un acte bien tourné vaut un délai de grâce."},{"id":"r_cens","kind":"recrue","star":1,"title":"Censitaires","effect":"+1 livre chaque hiver.","note":"Quelques habitants vous doivent cens et rentes à la Saint-Martin."},{"id":"r_barque","kind":"recrue","star":0,"title":"Maître de barque","effect":"Vos canots redescendent du lac Supérieur en 1 mois au lieu de 2.","note":"Il sait passer le Sault et les rapides sans décharger."},{"id":"r_aubergiste","kind":"recrue","star":0,"title":"Aubergiste de Montréal","effect":"Vos canots qui rentrent sont déchargés tout de suite.","note":"Ses hangars ouvrent à toute heure, même la nuit du retour."},{"id":"r_associe","kind":"recrue","star":0,"title":"Armateur associé","effect":"Quand un navire qui n’est pas à vous part avec vos peaux, vous payez 1 livre de fret en moins.","note":"Un vieil associé vous fait un prix d’ami."},{"id":"r_jesuite","kind":"recrue","star":1,"title":"Père jésuite","effect":"Quand une de vos expéditions rentre sans avoir échangé de baril : ravages −1 et soupçon −1.","note":"Les jésuites combattent la traite de l’eau-de-vie."},{"id":"r_huguenot","kind":"recrue","star":0,"title":"Négociant huguenot","effect":"La Rochelle vous avance jusqu’à 9 livres de dette au lieu de 6.","note":"Interdits d’établissement au Canada, les marchands protestants de La Rochelle y financent pourtant la traite."},{"id":"c_commission","kind":"contrat","star":0,"title":"Commission en France","effect":"Jusqu’en août : commandez jusqu’à 4 charges. Elles traversent sur votre navire libre à La Rochelle, sinon sur un navire marchand (2 livres de fret par charge), et arrivent dans 1 ou 2 mois selon le dé.","note":"Un commissionnaire de La Rochelle expédie un complément en pleine saison."},{"id":"c_foire","kind":"contrat","star":0,"title":"Foire de Montréal","effect":"En juin, juillet ou août : échangez jusqu’à 2 de vos charges de la piste contre des jetons du sac classique, sans canot. Chaque baril fait monter les ravages.","note":"Chaque été, les flottilles outaouaises descendent vendre leurs fourrures à Montréal."},{"id":"c_lettre","kind":"contrat","star":0,"title":"Lettre de change","effect":"Recevez 3 livres ; votre dette envers La Rochelle augmente de 4.","note":"Payable à la prochaine flotte."},{"id":"c_conge","kind":"contrat","star":0,"title":"Congé de faveur","effect":"Recevez un congé tout de suite, hors enchère.","note":"Signé de la main de l’intendant, sans passer par l’enchère."},{"id":"c_ferme","kind":"contrat","star":0,"title":"Contrat de la Ferme","effect":"Vendez à Québec jusqu’à 3 de vos peaux au prix de Paris moins 1 par point, sans navire.","note":"Le commis du fermier achète sur place, à bas prix."},{"id":"c_portage","kind":"contrat","star":0,"title":"Portage rapide","effect":"Un de vos canots en route avance tout de suite d’une case.","note":"Des porteurs connus gagnent une journée à chaque portage."},{"id":"c_rens","kind":"contrat","star":0,"title":"Renseignement de traite","effect":"Regardez les jetons cachés d’un lac.","note":"Un coureur des bois revenu de l’Ouest parle trop au cabaret."},{"id":"c_devants","kind":"contrat","star":0,"title":"Prendre les devants","effect":"Vous jouerez en premier le mois prochain, sans dépenser d’action.","note":"Vous êtes déjà dans l’antichambre de l’intendant."},{"id":"c_part","kind":"contrat","star":0,"title":"Part offerte","effect":"Prenez gratuitement 1 part d’une carte de navire au chantier.","note":"Un armateur vous cède une part pour sceller une alliance."},{"id":"c_denonce","kind":"contrat","star":0,"title":"Dénonciation à l’intendant","effect":"Un adversaire qui a 3 soupçon ou plus paie 2 livres.","note":"Une lettre anonyme sur l’eau-de-vie de vos rivaux."},{"id":"n_outaouais","kind":"nation","star":1,"title":"Les Outaouais","effect":"Aux lacs Huron et Michigan, vous voyez les jetons cachés avant de choisir. Perdue si vous y échangez un baril (ravages +1).","note":"Les Odawa sont les grands intermédiaires de la traite des Grands Lacs."},{"id":"n_poteo","kind":"nation","star":1,"title":"Les Potéouatamis de la baie des Puants","effect":"Au lac Michigan, vos marchandises ne comptent pas dans la demande de la zone. Perdue si vous y échangez un baril (ravages +1).","note":"Les Potawatomi accueillent la mission de la baie des Puants en 1669."},{"id":"n_anish","kind":"nation","star":1,"title":"Les Anishinaabeg du Sault","effect":"Vos canots qui arrivent au lac Supérieur sont prêts tout de suite. Perdue si vous y échangez un baril (ravages +1).","note":"Au Sault, les Anishinaabeg tiennent le passage vers le Supérieur."},{"id":"n_cinq","kind":"nation","star":1,"title":"Les Cinq-Nations","effect":"Au lac Ontario, un jeton caché qui n’est pas une peau vous rend votre charge, sans autre effet. Perdue si vous y échangez un baril (ravages +1).","note":"La paix de 1667 avec les Haudenosaunee rouvre le lac Ontario."},{"id":"n_wendat","kind":"nation","star":1,"title":"Les Wendat de Lorette","effect":"Vos guides sont gratuits. Perdue si une de vos expéditions échange un baril (ravages +1).","note":"Réfugiés près de Québec, les Wendat chrétiens refusent l’eau-de-vie."},{"id":"o_marg","kind":"charge","star":2,"title":"Marguillier de la paroisse","effect":"Si plusieurs marchands prennent le pas, vous passez devant.","note":"Un banc d’honneur à Notre-Dame de Québec."},{"id":"o_cons","kind":"charge","star":3,"title":"Conseiller au Conseil souverain","effect":"Vous gagnez les égalités de l’enchère des congés.","note":"Le Conseil souverain juge et réglemente la colonie."},{"id":"o_fief","kind":"charge","star":3,"title":"Fief sur le Richelieu","effect":"+1 livre chaque hiver (et noblesse, à venir).","note":"Les officiers du régiment de Carignan reçoivent des seigneuries le long du Richelieu."}];
const RKCOL={recrue:"#6B4A2A",contrat:"#3E5A7A",nation:"#2F5E4A",charge:"#7A2E3A"};

/* ---------- Installation ---------- */
function setup(n){
  S={n,z:10,id:1,pieces:{},decks:{sit:[],ev:[],dem:[],grand:[],rec:[]},bags:{classic:[],premium:[],hidden:[]}};
  const add=(o,x,y)=>{const id="p"+(S.id++);S.pieces[id]={id,x,y,z:S.z++,up:true,...o};return id};
  CARDS.forEach((c,i)=>S.decks.sit.push(add({k:"card",deck:"sit",ref:i,up:false,in:"deck"},0,0)));
  EVENTS.forEach((c,i)=>{for(let k=0;k<c.n;k++)S.decks.ev.push(add({k:"card",deck:"ev",ref:i,up:false,in:"deck"},0,0))});
  DEMANDE.forEach((c,i)=>S.decks.dem.push(add({k:"card",deck:"dem",ref:i,up:false,in:"deck"},0,0)));
  GRAND.forEach((c,i)=>S.decks.grand.push(add({k:"card",deck:"grand",ref:i,up:false,in:"deck"},0,0)));
  RCARDS.forEach((c,i)=>S.decks.rec.push(add({k:"card",deck:"rec",ref:i,up:false,in:"deck"},0,0)));
  Object.keys(S.decks).forEach(d=>shuffle(S.decks[d]));
  // Rivière de recrutement : paquet et cartes visibles (4, ou 5 à 4 joueurs)
  add({k:"deck",deck:"rec"},40,RIV_Y);
  for(let k=0;k<(n>=4?5:4);k++){const id=S.decks.rec.pop(),c=S.pieces[id];c.in=null;c.up=true;c.x=RIV_X+k*RIV_STEP+4;c.y=RIV_Y+22;c.z=S.z++}
  Object.keys(BAGS).forEach(b=>BAGS[b].items.forEach(it=>{for(let k=0;k<it.n;k++)S.bags[b].push(add({k:"chit",bag:b,q:it.q||0,e:it.k&&it.k!=="fur"?it.k:null,up:false,gras:false,in:"bag"},0,0))}));
  // Paquets et sacs dans la réserve générale
  add({k:"deck",deck:"sit"},1290,SUP.deckY);add({k:"deck",deck:"ev"},1418,SUP.deckY);add({k:"deck",deck:"dem"},1546,SUP.deckY);add({k:"deck",deck:"grand"},1674,SUP.deckY);
  add({k:"bag",bag:"classic"},1290,SUP.deck2Y);add({k:"bag",bag:"premium"},1420,SUP.deck2Y);add({k:"bag",bag:"hidden"},1550,SUP.deck2Y);
  // Marqueurs communs sur le plateau
  add({k:"tok",kind:"month",c:-1},...B(40+62,54+72));
  add({k:"tok",kind:"year",c:-1,label:"I"},...B(190,22));
  add({k:"tok",kind:"cube",c:-1},...B(RAV_X0+(RAV_STEP-4)/2-10,172+5));
  add({k:"tok",kind:"paris",c:-1},...M(PARIS_X+3*PARIS_STEP+2,132));
  for(let k=0;k<4;k++){const xy=k<n-1?M(450.6+k*36,213.7):[1860,SUP.bankY+120+k*26];add({k:"tok",kind:"conge",c:-1},...xy)}
  // Comptoir de Québec (gris) : il ne vend que son stock. Départ : cargaison du navire du roi (3 marchandises, 1 baril), 1 grand et 1 petit canot.
  const ptx=k=>BX+40+(k-1)*(PT_W+PT_GAP),bankRow=BY+PT_Y+40+4*30;
  for(let k=0;k<3;k++)add({k:"tok",kind:"march",c:-1,bank:true},ptx(2)+12+k*26,bankRow);add({k:"tok",kind:"baril",c:-1,bank:true},ptx(3)+12,bankRow);
  add({k:"tok",kind:"grand",c:-1,bank:true},ptx(2)+124,bankRow);add({k:"tok",kind:"petit",c:-1,bank:true},ptx(1)+12,bankRow);
  for(let k=0;k<8;k++)add({k:"tok",kind:"march",c:-1,bank:true},1300+k*28,SUP.bankY+30);for(let k=0;k<4;k++)add({k:"tok",kind:"baril",c:-1,bank:true},1300+k*28,SUP.bankY+62);
  // Le navire du roi est déjà en rade au premier tour
  add({k:"tok",kind:"ship",c:-1,bank:true,roi:true},...M(665.6,337.4));
  // Navire marchand générique, en chargement à La Rochelle
  add({k:"tok",kind:"ship",c:-1,bank:true,merch:true},...M(1058.9,355.5));
  // Chantier : cartes de navire à 5 parts
  for(let k=0;k<6;k++)add({k:"tok",kind:"shipcard",c:-1},1290+(k%3)*140,SUP.yardY+20+Math.floor(k/3)*76);
  for(let k=0;k<3;k++)add({k:"tok",kind:"pas",c:-1},1580+k*44,SUP.bankY+76);
  // Dés, équipiers, jetons de prix
  add({k:"die",v:3},1580,SUP.diceY+30);add({k:"die",v:5},1630,SUP.diceY+30);add({k:"die",v:1,cross:true},1680,SUP.diceY+30);
  CREW.forEach((c,ci)=>{for(let k=0;k<4;k++)add({k:"tok",kind:"crew",c:-1,crew:c.id},1300+ci*170+k*40,SUP.crewY+30)});
  for(let v=1;v<=8;v++)for(let k=0;k<4;k++)add({k:"tok",kind:"num",c:-1,label:String(v)},1300+(v-1)*80+(k%2)*28,SUP.numY+30+Math.floor(k/2)*28);
  // Plateaux des joueurs
  for(let i=0;i<n;i++){
    const mx=-257+i*614,my=MAT_Y;
    for(let k=0;k<8;k++){add({k:"tok",kind:"baril",c:i},mx+16+k*28,my+58);add({k:"tok",kind:"march",c:i},mx+16+k*28,my+88)}
    for(let k=0;k<2;k++){add({k:"tok",kind:"grand",c:i},mx+16+k*60,my+124);add({k:"tok",kind:"petit",c:i},mx+140+k*46,my+124);add({k:"tok",kind:"ship",c:i},mx+236+k*46,my+120);add({k:"tok",kind:"alambic",c:i},mx+332+k*32,my+118)}
    add({k:"tok",kind:"pawn",c:i},mx+404,my+120);
    for(let k=0;k<8;k++)add({k:"tok",kind:"part",c:i},mx+16+k*20,my+400);
    add({k:"tok",kind:"disc",c:i},mx+246+0*26+4,my+10);
    const lx=BX+40+90+(1120-90)/31*0,dx=BX+40+90+10*(1120-90)/21; /* crédit : jeton sur 0, au milieu */
    add({k:"tok",kind:"disc",c:i,track:"livres"},lx+4+(i%2)*12,BY+LIV_Y+4+Math.floor(i/2)*14);
    add({k:"tok",kind:"disc",c:i,track:"credit"},dx+4+(i%2)*12,BY+DET_Y+4+Math.floor(i/2)*14);
  }
  hist=[];$("undo").disabled=true;sel=null;peek=null;save();renderPrinted();render();fit();
}

/* ---------- Panneau latéral ---------- */
function describe(p){
  if(p.k==="card"){const c=cardInfo(p);return{title:p.up||peek===p.id?c.title:`Carte · ${DECKS[p.deck].name}`,body:p.up||peek===p.id?`<div class="big">${cardHTML(p,true)}</div>${c.note?`<p class="muted"><i>${c.note}</i></p>`:""}`:`<div class="big">${cardHTML(p)}</div><p class="muted">Face cachée. « Regarder » montre la carte ici seulement : les autres détournent les yeux.</p>`,acts:["flip","peek","back","front"]}}
  if(p.k==="chit"){const b=BAGS[p.bag],shown=p.up||peek===p.id;const txt=!shown?`Jeton face cachée, du ${b.name.toLowerCase()}.`:p.e?`${HID[p.e].t} : ${HID[p.e].x}`:`Peau de qualité ${p.q}${p.bag==="hidden"?" (jeton caché ; +1 au lac Supérieur)":""}.${p.gras?" Castor gras : 1 livre de plus par point à la vente.":""}`;
    return{title:shown?(p.e?HID[p.e].t:`Peau de qualité ${p.q}`):"Jeton de fourrure",body:`<div class="big">${chitHTML(p,shown)}</div><p>${txt}</p>`,acts:["flip","peek","gras","back","front"]}}
  if(p.k==="deck")return{title:DECKS[p.deck].name,body:`<p>${S.decks[p.deck].length} carte${S.decks[p.deck].length>1?"s":""} dans le paquet. Glissez le paquet pour en tirer la carte du dessus, ou utilisez les boutons. Déposez une carte dessus pour la remettre.</p>`,acts:["draw","drawup","shuffle"]};
  if(p.k==="bag"){const b=BAGS[p.bag];return{title:b.name,body:`<p>${S.bags[p.bag].length} jeton${S.bags[p.bag].length>1?"s":""} dans le sac (${b.sub.toLowerCase()}). Cliquez pour en piocher un au hasard ; déposez un jeton de ce sac dessus pour le remettre.</p>`,acts:["drawbag","drawbagup"]}}
  if(p.k==="die")return{title:p.cross?"Dé de traversée":"Dé",body:`<p>Résultat : <b>${p.v}</b>. Cliquez sur le dé pour le relancer.</p>${p.cross?`<p class="muted">Seulement quand un événement le met en jeu (Gros temps sur l’Atlantique, Guerre en Europe) : chaque navire qui arrive ou qui part le lance, sur 1 il est perdu avec sa cargaison.</p>`:""}`,acts:["roll","front"]};
  const names={baril:"Baril d’eau-de-vie",march:"Marchandise",grand:"Grand canot (5 places)",petit:"Petit canot (3 places)",ship:"Navire (4 cales)",shipcard:"Carte de navire",pas:"Jeton « Prendre le pas »",part:"Disque de part",alambic:"Distillerie",pawn:"Pion d’expédition",disc:"Marqueur",cube:"Marqueur des ravages",conge:"Congé",crew:"Équipier",num:"Jeton de prix",month:"Marqueur du mois",year:"Marqueur de l’année",paris:"Marqueur du prix de Paris"};
  let t=names[p.kind]||"Pièce";if(p.kind==="crew"){const c=CREW.find(x=>x.id===p.crew);t=c.label}
  const owner=p.c>=0?` · joueur ${COLNAME[p.c]}`:p.bank?" · banque":"";
  const more=p.kind==="crew"?CREW.find(x=>x.id===p.crew).text:p.kind==="ship"&&p.merch?"Navire marchand : il ne sert qu’avec la carte « Commission en France » : il emporte la commande (2 livres de fret par charge), lance le dé de traversée, puis reste en rade à Québec avec 4 places pour des peaux.":p.kind==="ship"&&p.roi?"Le navire du roi est en rade dès avril les années I et II, avec 3 marchandises et 1 baril pour le comptoir. 4 places publiques, fret fixé à son arrivée (milieu entre le plus bas et le plus haut fret des joueurs, arrondi en bas ; 2 sans navire de joueur), pas de faux fret. Réquisitionné à partir de l’année III.":p.kind==="pas"?"Pris avec l’action « Prendre le pas » : vous jouerez en premier le mois prochain. S’il y en a plusieurs, l’ordre de prise compte (posez-les dans l’ordre).":p.kind==="shipcard"?"5 parts de 1 livre (4 avec le Chantier naval, une part offerte). Posez un disque de votre couleur sur chaque part que vous financez ; à 5 parts, le navire est armé. Le joueur qui a le plus de parts (le fondateur en cas d’égalité) est l’armateur principal : il fixe le fret, tient la place réservée et paie le lest, le faux fret d’un départ anticipé et l’entretien d’hiver. Le fret encaissé se partage selon les parts.":p.kind==="disc"&&p.dem?(p.dem==="gl"?"Marchandises acceptées cette année aux Grands Lacs (6 au plus).":"Marchandises acceptées cette année au lac Supérieur (2 au plus)."):p.kind==="num"?`Valeur ${p.label}.`:"";
  return{title:t+owner,body:`<div class="big"><div class="tok" style="width:${sizeOf(p)[0]*2.4}px;height:${sizeOf(p)[1]*2.4}px">${tokSVG(p)}</div></div>${more?`<p>${more}</p>`:""}`,acts:["front"]};
}
const ACT={flip:"Retourner",peek:"Regarder en secret",gras:"Castor gras",back:"Remettre au paquet ou au sac",front:"Premier plan",draw:"Piocher face cachée",drawup:"Piocher face visible",shuffle:"Mélanger",drawbag:"Piocher face cachée",drawbagup:"Piocher face visible",roll:"Lancer"};
function renderSide(){
  const p=sel&&S.pieces[sel];
  if(!p||p.in){$("side").innerHTML=`<h2>Bac à sable</h2><p class="muted">Rien n’est automatique : déplacez les pièces et appliquez les règles vous-mêmes.</p><ul>
    <li>Glissez une pièce pour la déplacer.</li><li>Double-cliquez, ou appuyez sur <kbd>F</kbd>, pour retourner une carte ou un jeton.</li><li>Glissez un paquet pour tirer la carte du dessus ; déposez une carte dessus pour la remettre.</li><li>Cliquez sur un sac pour piocher un jeton au hasard ; déposez un jeton dessus pour le remettre.</li><li>Cliquez sur un dé pour le lancer.</li><li>« Regarder en secret » montre une carte ou un jeton ici, sans le retourner.</li><li><kbd>Ctrl</kbd>+<kbd>Z</kbd> annule.</li></ul>
    <p class="muted">Installation : chaque joueur commence avec sa réserve, ses marqueurs à 0 sur les pistes et son pion. Le draft se fait en piochant 4 situations chacun. Le navire du roi est déjà en rade, et sa cargaison au comptoir (gris). Chaque joueur affiche un seul prix par ressource : tous ses barils au même prix, toutes ses marchandises, tous ses grands canots, tous ses petits canots, et un seul fret pour tous ses navires. Une nouvelle pièce rejoint ce prix, ou déplace tout le lot si vous en choisissez un autre ; un navire armé prend le fret des autres navires de son armateur principal. Tout produit générique (marchandise ou baril du comptoir, canot du comptoir, fret du navire du roi ou du navire marchand) reçoit son prix quand il arrive sur le plateau : le milieu entre le prix le plus bas et le plus haut affichés par les joueurs pour ce produit, arrondi à l’inférieur (sans offre : marchandise 2, baril 3, grand canot 2, petit canot 1, fret 2). Il ne bouge plus ensuite. Au départ, posez les jetons gris une fois que tous les joueurs ont placé leurs produits. Dès le draft fini, chacun pose ses produits, canots et navires sur la piste des prix. Pas d’événement avant la fin du premier mois ; la demande de Paris se tire en hiver. Partie en 5 ans. Congés : il y en a autant que de joueurs moins un par an. Ils sont délivrés sur un dé de 3+ en avril, 2+ en mai, et sûrement en juin, puis mis aux enchères secrètes. Égalité : noblesse (à venir), puis le moins de soupçon, puis l’ordre du tour. Un congé par expédition hors coureur des bois ; l’Ami du gouverneur en reçoit un gratuit. En hiver, chacun prépare ses navires à La Rochelle (commande, lest) et fait un investissement gratuit, sans action. L’ordre du tour tourne d’un cran chaque mois ; l’action « Prendre le pas » fait jouer en premier le mois suivant. Canots : un canot qui arrive aux Grands Lacs (ou au Supérieur) se pose dans la partie rayée ; il ne visite pas de lac ce mois-là. Au début du mois suivant, il glisse dans la partie pleine : il est prêt et peut aller à un lac. Au retour, il se pose dans la zone rayée de Montréal et n’est déchargé (peaux à Québec, charges à quai) qu’au début du mois suivant ; en hiver, déchargez tout de suite. Début de mois : faites d’abord glisser les canots des zones rayées, puis avancez les canots en route. Pendant l’année, « Commander en France » et « Investir » restent des actions. Il n’y a plus de commande en saison : seule la carte « Commission en France » le permet (jusqu’à 4 charges, sur votre navire libre ou le navire marchand à 2 livres de fret par charge ; dé de traversée, 4+ arrive le mois suivant, sinon un mois plus tard). Recruter : une action, prenez une carte de la rivière au prix de sa case. Recrues, alliances et charges se posent devant vous ; un contrat se garde en main (deux au plus) et se joue pendant votre tour, sans action. Une alliance avec une nation est perdue dès que vous échangez un baril chez elle (ravages +1). À Québec, faire partir un navire avant qu’il soit plein coûte 1 livre de faux fret par place vide. « Changer les prix » repose tout ce que vous avez sur la piste des prix. Prix : navire 5, distillerie 4, grand canot 3, petit canot 2, représentant 2, guide, milicien et interprète 1, canot de coureur des bois 1 par départ ; la location d’un canot se fait au prix que fixe son propriétaire.</p>`;return}
  const D=describe(p);
  $("side").innerHTML=`<h2>${D.title}</h2>${D.body}<div class="acts">${D.acts.filter(a=>!(a==="peek"&&p.up)&&!(a==="gras"&&(!p.up||p.e))).map(a=>`<button class="tb" data-cmd="${a}">${a==="gras"&&p.gras?"Retirer le castor gras":ACT[a]}</button>`).join("")}</div>`;
}

/* ---------- Actions ---------- */
function topZ(p){p.z=++S.z}
function flip(p){if(p.k!=="card"&&p.k!=="chit")return;snap();p.up=!p.up;peek=null;save();render()}
function drawFrom(deckPiece,up,at){const arr=S.decks[deckPiece.deck];if(!arr.length)return null;const id=arr.pop(),c=S.pieces[id];c.in=null;c.up=!!up;
  const [x,y]=at||[deckPiece.x+118+(S.drawn=(S.drawn||0)+1)%5*10,deckPiece.y+18+(S.drawn%5)*10];c.x=x;c.y=y;topZ(c);return c}
function drawBag(bagPiece,up){const arr=S.bags[bagPiece.bag];if(!arr.length)return null;const id=arr.splice(Math.floor(Math.random()*arr.length),1)[0],c=S.pieces[id];c.in=null;c.up=!!up;c.gras=false;
  const k=(S.bagDrawn=(S.bagDrawn||0)+1)%6;c.x=bagPiece.x+8+k*16;c.y=bagPiece.y+130+(k%2)*8;topZ(c);return c}
function putBack(p){
  if(p.k==="card"){snap();p.in="deck";p.up=false;S.decks[p.deck].push(p.id)}
  else if(p.k==="chit"){snap();p.in="bag";p.up=false;p.gras=false;S.bags[p.bag].push(p.id)}
  else return;
  if(sel===p.id)sel=null;peek=null;save();render();
}
function command(cmd){
  const p=sel&&S.pieces[sel];
  switch(cmd){
    case"reset":{const b=$("reset");if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirmer ?";setTimeout(()=>{b.dataset.confirm="";b.textContent="Nouvelle installation"},3000);return}b.dataset.confirm="";b.textContent="Nouvelle installation";setup(+$("nplayers").value);return}
    case"undo":return undo();
    case"zin":return setZoom(zoom*1.2);
    case"zout":return setZoom(zoom/1.2);
    case"fit":return fit();
  }
  if(!p)return;
  switch(cmd){
    case"flip":return flip(p);
    case"peek":peek=peek===p.id?null:p.id;return renderSide();
    case"gras":snap();p.gras=!p.gras;save();return render();
    case"back":return putBack(p);
    case"front":snap();topZ(p);save();return render();
    case"draw":case"drawup":{snap();const c=drawFrom(p,cmd==="drawup");if(c)sel=c.id;save();return render()}
    case"shuffle":snap();shuffle(S.decks[p.deck]);save();return render();
    case"drawbag":case"drawbagup":{snap();const c=drawBag(p,cmd==="drawbagup");if(c)sel=c.id;save();return render()}
    case"roll":return roll(p);
  }
}
function roll(p){snap();p.v=1+Math.floor(Math.random()*6);p.rolled=true;save();render()}

/* ---------- Glisser-déposer ---------- */
function tablePoint(e){const r=$("table").getBoundingClientRect();return[(e.clientX-r.left)/zoom,(e.clientY-r.top)/zoom]}
function hitContainer(p,px,py){
  return Object.values(S.pieces).find(q=>!q.in&&q!==p&&((p.k==="card"&&q.k==="deck"&&q.deck===p.deck)||(p.k==="chit"&&q.k==="bag"&&q.bag===p.bag))&&px>=q.x&&px<=q.x+sizeOf(q)[0]&&py>=q.y&&py<=q.y+sizeOf(q)[1]);
}
$("pieces").addEventListener("pointerdown",e=>{
  const el=e.target.closest("[data-pid]");if(!el)return;
  const p=S.pieces[el.dataset.pid],[px,py]=tablePoint(e);
  drag={id:p.id,el,sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,px,py,moved:false,handle:!!e.target.closest("[data-handle]"),pre:JSON.stringify(S)};
  el.setPointerCapture(e.pointerId);e.preventDefault();
});
window.addEventListener("pointermove",e=>{
  if(!drag)return;const dx=(e.clientX-drag.sx)/zoom,dy=(e.clientY-drag.sy)/zoom;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<4)return;
  if(!drag.moved){drag.moved=true;const p=S.pieces[drag.id];
    if((p.k==="deck"||p.k==="bag")&&!drag.handle){
      const c=p.k==="deck"?drawFrom(p,false,[drag.px-50,drag.py-70]):drawBag(p,false);
      if(!c){drag=null;return}
      if(p.k==="bag"){c.x=drag.px-15;c.y=drag.py-15}
      render();const el=$("pieces").querySelector(`[data-pid="${c.id}"]`);try{el.setPointerCapture(e.pointerId)}catch(err){}drag.id=c.id;drag.el=el;drag.ox=c.x;drag.oy=c.y;drag.drawn=true;
    }else{topZ(p);drag.el.style.zIndex=p.z}
    drag.el.classList.add("dragging");
  }
  const p=S.pieces[drag.id];p.x=Math.round(drag.ox+dx);p.y=Math.round(drag.oy+dy);drag.el.style.left=p.x+"px";drag.el.style.top=p.y+"px";
});
function endDrag(e){
  if(!drag)return;const d=drag;drag=null;const p=S.pieces[d.id];
  if(!d.moved){
    const now=Date.now();
    if(p.k==="die"){sel=p.id;return roll(p)}
    if(p.k==="bag"&&!d.handle){hist.push(d.pre);$("undo").disabled=false;const c=drawBag(p,false);sel=c?c.id:p.id;save();return render()}
    if(lastClick.id===p.id&&now-lastClick.t<350){lastClick={id:null,t:0};return flip(p)}
    lastClick={id:p.id,t:now};sel=p.id;peek=null;return render();
  }
  hist.push(d.pre);if(hist.length>60)hist.shift();$("undo").disabled=false;
  const [px,py]=tablePoint(e),box=hitContainer(p,px,py);
  sel=p.id;
  if(box){p.in=p.k==="card"?"deck":"bag";p.up=false;if(p.k==="card")S.decks[p.deck].push(p.id);else{p.gras=false;S.bags[p.bag].push(p.id)}sel=null}
  save();render();
}
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);
$("view").addEventListener("pointerdown",e=>{if(!e.target.closest("[data-pid]")&&sel){sel=null;peek=null;render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-cmd]");if(b&&!b.disabled)command(b.dataset.cmd)});
document.addEventListener("keydown",e=>{
  if(e.target.closest("select,input,textarea"))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();return undo()}
  if(e.key==="f"||e.key==="F"){const p=sel&&S.pieces[sel];if(p)flip(p)}
  if(e.key==="Escape"&&sel){sel=null;peek=null;render()}
});
$("view").addEventListener("wheel",e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:1/1.1))},{passive:false});
window.addEventListener("resize",()=>{if(zoom<.21)fit()});

/* ---------- Démarrage ---------- */
function start(data){
  S=(data&&data.state)||load();
  if(S){$("nplayers").value=String(S.n);renderPrinted();render();fit()}else setup(3);
}
window.claude?.hot?.snapshot?.(()=>({state:S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
